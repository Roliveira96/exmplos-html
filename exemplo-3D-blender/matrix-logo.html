<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efeito Matrix Logo 3D - Studio4You</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #e5e7eb;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .card {
            width: 1400px;
            height: 800px;
            max-width: 95vw;
            max-height: 90vh;
            background: #f8fafc;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
            display: flex;
            transition: all 0.3s ease;
        }

        .card-content {
            flex: 0 0 45%;
            padding: 60px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            pointer-events: none;
        }

        .card-content h1 {
            color: #1f2937;
            font-size: 3.5rem;
            margin-bottom: 20px;
            line-height: 1.1;
        }

        .card-content p {
            color: #4b5563;
            font-size: 1.25rem;
            max-width: 450px;
            line-height: 1.6;
        }

        .btn-interact {
            margin-top: 30px;
            padding: 15px 30px;
            background-color: #f97316;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            align-self: flex-start;
            transition: background 0.3s;
        }

        .btn-interact:hover {
            background-color: #ea580c;
        }

        .matrix-container {
            position: absolute;
            top: 0;
            right: 0;
            width: 60%;
            height: 100%;
            z-index: 5;
            cursor: default;
        }

        .loading {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 14px;
            color: #6b7280;
            z-index: 20;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.8);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="card-content">
            <h1>Matrix<br>3D Concept</h1>
            <p>Este efeito de chuva utiliza objetos 3D. Passe o mouse sobre a área da direita para ver os itens pararem
                suavemente sob o cursor.</p>
            <button class="btn-interact">Interagir</button>
        </div>
        <div id="loading" class="loading">Iniciando chuva 3D...</div>
        <div class="matrix-container" id="matrix-canvas"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        let scene, camera, renderer, container, loadingElement;
        let materials, logos = [];
        const mouse = new THREE.Vector2(-10, -10);
        const tempV3 = new THREE.Vector3();
        const planesZ = [9, -20, -90, -240, -1990, -2490];
        const totalLogos = 190;

        init();

        function init() {
            container = document.getElementById('matrix-canvas');
            loadingElement = document.getElementById('loading');
            initScene();
            initLights();
            initMaterials();
            initEventListeners();
            loadModel();
        }

        function initScene() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 3000);
            camera.position.z = 10;
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);
        }

        function initLights() {
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            addDirLight(0xffffff, 1, 50, 100, 50);
            addDirLight(0xffa500, 0.5, -50, -50, 50);
            addDirLight(0xa0c0ff, 0.4, 50, -50, -50);
        }

        function addDirLight(c, i, x, y, z) {
            const l = new THREE.DirectionalLight(c, i);
            l.position.set(x, y, z);
            scene.add(l);
        }

        function initMaterials() {
            materials = [
                new THREE.MeshStandardMaterial({ color: 0x9ca3af, roughness: 0.3, metalness: 0.4 }),
                new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.2, metalness: 0.3 }),
                new THREE.MeshPhysicalMaterial({ color: 0xf97316, metalness: 0.3, roughness: 0.8, transmission: 0.6, thickness: 11.0, transparent: true, opacity: 1.4 }),
                new THREE.MeshPhysicalMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.1, transmission: 0.9, thickness: 11.0, transparent: true, opacity: 1.4 }),
                new THREE.MeshStandardMaterial({ color: 0xe5e7eb, roughness: 0.1, metalness: 0.5, emissive: 0xe5e7eb, emissiveIntensity: .5 })
            ];
        }

        function initEventListeners() {
            container.addEventListener('mousemove', (e) => updateMouse(e.clientX, e.clientY));
            container.addEventListener('mouseleave', () => mouse.set(-10, -10));
            container.addEventListener('touchmove', (e) => updateMouse(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
            window.addEventListener('resize', onResize);
        }

        function updateMouse(x, y) {
            const r = container.getBoundingClientRect();
            mouse.x = ((x - r.left) / r.width) * 2 - 1;
            mouse.y = -((y - r.top) / r.height) * 2 + 1;
        }

        function onResize() {
            const r = container.getBoundingClientRect();
            camera.aspect = r.width / r.height;
            camera.updateProjectionMatrix();
            renderer.setSize(r.width, r.height);
        }

        function loadModel() {
            const loader = new THREE.GLTFLoader();
            loader.load('LOGO-STUDIO4YOU.glb', (gltf) => {
                loadingElement.style.display = 'none';
                setupLogos(gltf.scene);
                animate();
            }, undefined, (err) => {
                console.error(err);
                loadingElement.innerText = "Erro ao carregar o logo.";
            });
        }

        function setupLogos(mesh) {
            const box = new THREE.Box3().setFromObject(mesh);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const baseScale = 0.5 / maxDim;
            const weights = [0.03, 0.07, 0.15, 0.25, 0.25, 0.25];

            weights.forEach((w, i) => {
                const n = Math.round(totalLogos * w);
                for (let j = 0; j < n; j++) {
                    const l = createLogo(mesh, planesZ[i], i, baseScale, maxDim);
                    logos.push(l);
                    scene.add(l.mesh);
                }
            });
        }

        function createLogo(mesh, z, idx, scale, dim) {
            const l = mesh.clone();
            const mat = materials[Math.floor(Math.random() * materials.length)];
            l.traverse((c) => { if (c.isMesh) c.material = mat.clone(); });

            const d = camera.position.z - z;
            const s = scale * Math.pow(d, 0.7);
            l.scale.set(s, s, s);

            const vH = 2 * d * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
            const vW = vH * camera.aspect;

            l.position.set((Math.random() * 1.0 - 0.1) * (vW / 2), (Math.random() * 2.5 - 1) * (vH / 2), z);
            l.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);

            const sp = [2.0, 1.5, 1.0, 1.0, 0.7, 0.7];
            const baseS = (0.04 + Math.random() * 0.02) * sp[idx] * (vH / 30);

            return {
                mesh: l,
                planeZ: z,
                rotS: { x: (Math.random() - 0.5) * 0.01, y: (Math.random() - 0.5) * 0.01, z: (Math.random() - 0.5) * 0.01 },
                speed: baseS,
                vH: vH,
                radius: (dim * s) / 2,
                hoverM: 1.0
            };
        }

        function animate() {
            requestAnimationFrame(animate);
            logos.forEach(updateLogo);
            renderer.render(scene, camera);
        }

        function updateLogo(l) {
            tempV3.copy(l.mesh.position).project(camera);
            const dNDC = Math.sqrt(Math.pow(mouse.x - tempV3.x, 2) + Math.pow(mouse.y - tempV3.y, 2));
            l.hoverM += ((dNDC < 0.25 ? 0.0 : 1.0) - l.hoverM) * 0.1;

            l.mesh.rotation.x += l.rotS.x * l.hoverM;
            l.mesh.rotation.y += l.rotS.y * l.hoverM;
            l.mesh.rotation.z += l.rotS.z * l.hoverM;
            l.mesh.position.y -= l.speed * l.hoverM;

            resolveCollisions(l);
            resetLogo(l);
        }

        function resolveCollisions(l) {
            logos.forEach(o => {
                if (l === o || l.planeZ !== o.planeZ) return;
                const dx = l.mesh.position.x - o.mesh.position.x;
                const dy = l.mesh.position.y - o.mesh.position.y;
                const d = Math.sqrt(dx * dx + dy * dy);
                const min = l.radius + o.radius;
                if (d < min) {
                    const overlap = min - d;
                    const nx = dx / (d || 0.1);
                    const ny = dy / (d || 0.1);
                    l.mesh.position.x += nx * overlap * 0.025;
                    l.mesh.position.y += ny * overlap * 0.025;
                    o.mesh.position.x -= nx * overlap * 0.025;
                    o.mesh.position.y -= ny * overlap * 0.025;
                }
            });
        }

        function resetLogo(l) {
            const limit = l.vH * 0.7;
            if (l.mesh.position.y < -limit) {
                l.mesh.position.y = limit + Math.random() * 10;
                l.mesh.position.x = (Math.random() * 1.0 - 0.1) * (l.vH * camera.aspect / 2);
            }
        }
    </script>
</body>

</html>
