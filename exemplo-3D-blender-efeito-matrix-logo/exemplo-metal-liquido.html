<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnetismo Líquido - Studio4You</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-bg: #030712;
            --accent-color: #f8fafc;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.1);
            --panel-width: 360px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image:
                radial-gradient(circle at 10% 10%, rgba(255, 255, 255, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(255, 255, 255, 0.03) 0%, transparent 40%);
        }

        .main-layout {
            width: 98%;
            max-width: 1700px;
            height: 95vh;
            display: grid;
            grid-template-columns: var(--panel-width) 1fr;
            background: var(--glass-bg);
            backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.9);
        }

        .controls-panel {
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .header {
            margin-bottom: 2rem;
        }

        .badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: #fff;
            color: #000;
            border-radius: 100px;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            line-height: 1.1;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .section-title {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin: 2.5rem 0 1.2rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--glass-border);
        }

        .control-group {
            margin-bottom: 1.5rem;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
        }

        .label-row span {
            color: #fff;
            font-weight: 600;
            font-family: monospace;
        }

        input[type="range"] {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            appearance: none;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .magnet-status {
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            border: 1px solid var(--glass-border);
            margin-top: auto;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 10px #4ade80;
        }

        .viewer-container {
            position: relative;
            cursor: none;
        }

        #canvas-3d {
            width: 100%;
            height: 100%;
        }

        #magnet-cursor {
            position: fixed;
            width: 40px;
            height: 40px;
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
            transform: translate(-50%, -50%);
            mix-blend-mode: difference;
            transition: width 0.3s, height 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        .loading-overlay {
            position: absolute;
            inset: 0;
            background: var(--primary-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
    </style>
</head>

<body>
    <div id="magnet-cursor">🧲</div>

    <div class="loading-overlay" id="loading">
        <p style="letter-spacing: 0.3em; font-weight: 300;">POLARIZANDO CAMPO MAGNÉTICO...</p>
    </div>

    <main class="main-layout">
        <aside class="controls-panel">
            <header class="header">
                <span class="badge">Ferrofluid Simulation</span>
                <h1>Magnetismo</h1>
                <p class="subtitle">Aproxime o imã do objeto para deformar a estrutura molecular do metal.</p>
            </header>

            <div class="section-title">Parâmetros do Campo</div>

            <div class="control-group">
                <div class="label-row">Força Ativa <span id="force-val">3.5</span></div>
                <input type="range" id="strength" min="0" max="15" step="0.1" value="3.5">
            </div>

            <div class="control-group">
                <div class="label-row">Raio de Influência <span id="range-val">2.0</span></div>
                <input type="range" id="range" min="0.5" max="5" step="0.1" value="2.0">
            </div>

            <div class="control-group">
                <div class="label-row">Picos (Spikes) <span id="spike-val">4.0</span></div>
                <input type="range" id="spikes" min="1" max="15" step="0.1" value="4.0">
            </div>

            <div class="section-title">Material</div>

            <div class="control-group">
                <div class="label-row">Rugosidade <span id="visco-val">0.02</span></div>
                <input type="range" id="roughness" min="0" max="0.5" step="0.01" value="0.02">
            </div>

            <div class="magnet-status">
                <div style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase;">Estado</div>
                <div style="font-size: 0.9rem;"><span class="status-dot"></span> Campo Estável</div>
            </div>
        </aside>

        <section class="viewer-container">
            <canvas id="canvas-3d"></canvas>
        </section>
    </main>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

        const params = {
            strength: 3.5,
            range: 2.0,
            spikes: 4.0,
            roughness: 0.02,
            mouse3D: new THREE.Vector3(20, 20, 20),
            targetMouse3D: new THREE.Vector3(20, 20, 20)
        };

        const canvas = document.querySelector('#canvas-3d');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
        camera.position.set(0, 0, 7);

        const controls = new OrbitControls(camera, canvas);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;

        const cursor = document.getElementById('magnet-cursor');
        const raycaster = new THREE.Raycaster();
        let targetMesh = null;

        window.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            const rect = canvas.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            const y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera({ x, y }, camera);
        });

        const magnetShaderHeader = `
            uniform float uTime;
            uniform vec3 uMagnetPos;
            uniform float uStrength;
            uniform float uRange;
            uniform float uSpikes;

            vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
            vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
            float snoise(vec3 v){ 
              const vec2 C = vec2(1.0/6.0, 1.0/3.0);
              const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
              vec3 i = floor(v + dot(v, C.yyy));
              vec3 x0 = v - i + dot(i, C.xxx);
              vec3 g = step(x0.yzx, x0.xyz);
              vec3 l = 1.0 - g;
              vec3 i1 = min(g.xyz, l.zxy);
              vec3 i2 = max(g.xyz, l.zxy);
              vec3 x1 = x0 - i1 + 1.0 * C.xxx;
              vec3 x2 = x0 - i2 + 2.0 * C.xxx;
              vec3 x3 = x0 - D.yyy;
              i = mod(i, 289.0);
              vec4 p = permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
              float n_ = 1.0/7.0;
              vec3 ns = n_*D.wyz-D.xzx;
              vec4 j = p-49.0*floor(p*ns.z*ns.z);
              vec4 x_ = floor(j*ns.z);
              vec4 y_ = floor(j-7.0*x_);
              vec4 x = x_*ns.x+ns.yyyy;
              vec4 y = y_*ns.x+ns.yyyy;
              vec4 h = 1.0-abs(x)-abs(y);
              vec4 b0 = vec4(x.xy,y.xy);
              vec4 b1 = vec4(x.zw,y.zw);
              vec4 s0 = floor(b0)*2.0+1.0;
              vec4 s1 = floor(b1)*2.0+1.0;
              vec4 sh = -step(h,vec4(0.0));
              vec4 a0 = b0.xzyw+s0.xzyw*sh.xxyy;
              vec4 a1 = b1.xzyw+s1.xzyw*sh.zzww;
              vec3 p0 = vec3(a0.xy,h.x);
              vec3 p1 = vec3(a0.zw,h.y);
              vec3 p2 = vec3(a1.xy,h.z);
              vec3 p3 = vec3(a1.zw,h.w);
              vec4 norm = taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
              p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
              vec4 m = max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)), 0.0);
              m = m*m;
              return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
            }
        `;

        const magnetShaderBody = `
            vec3 worldPos = (modelMatrix * vec4(position, 1.0)).xyz;
            float dist = distance(worldPos, uMagnetPos);
            float magnetInfluence = smoothstep(uRange, 0.0, dist);
            float n = snoise(vec3(position * uSpikes + uTime * 2.0));
            float spikes = pow(abs(n), 2.0) * sign(n);
            vec3 dirToMagnet = normalize(uMagnetPos - worldPos);
            vec3 transformed = position + normal * spikes * uStrength * magnetInfluence;
            transformed += dirToMagnet * spikes * uStrength * magnetInfluence * 0.5;
        `;

        new RGBELoader()
            .setPath('https://threejs.org/examples/textures/equirectangular/')
            .load('studio_small_03_1k.hdr', (texture) => {
                texture.mapping = THREE.EquirectangularReflectionMapping;
                scene.environment = texture;
                loadModel();
            });

        let material;
        function loadModel() {
            material = new THREE.MeshPhysicalMaterial({
                color: 0x111111,
                metalness: 1.0,
                roughness: params.roughness,
                reflectivity: 1.0,
                clearcoat: 1.0
            });

            material.onBeforeCompile = (shader) => {
                shader.uniforms.uTime = { value: 0 };
                shader.uniforms.uMagnetPos = { value: params.mouse3D };
                shader.uniforms.uStrength = { value: params.strength };
                shader.uniforms.uRange = { value: params.range };
                shader.uniforms.uSpikes = { value: params.spikes };

                shader.vertexShader = magnetShaderHeader + shader.vertexShader;
                shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', magnetShaderBody);
                material.userData.shader = shader;
            };

            const loader = new GLTFLoader();
            loader.load('LOGO-STUDIO4YOU.glb', (gltf) => {
                const model = gltf.scene;
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                model.position.sub(center);
                model.traverse(c => { if (c.isMesh) { c.material = material; targetMesh = c; } });
                scene.add(model);
                document.getElementById('loading').style.display = 'none';
            }, undefined, () => {
                const geo = new THREE.IcosahedronGeometry(2, 128);
                const mesh = new THREE.Mesh(geo, material);
                scene.add(mesh);
                targetMesh = mesh;
                document.getElementById('loading').style.display = 'none';
            });
        }

        ['strength', 'range', 'spikes', 'roughness'].forEach(id => {
            document.getElementById(id).addEventListener('input', (e) => {
                params[id] = parseFloat(e.target.value);
                const labelId = id === 'strength' ? 'force' : (id === 'roughness' ? 'visco' : (id === 'spikes' ? 'spike' : 'range'));
                document.getElementById(labelId + '-val').innerText = params[id].toFixed(2);
                if (id === 'roughness') material.roughness = params[id];
            });
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsed = clock.getElapsedTime();

            if (targetMesh) {
                const intersections = raycaster.intersectObject(targetMesh, true);
                if (intersections.length > 0) {
                    params.targetMouse3D.copy(intersections[0].point);
                    cursor.style.width = '100px';
                    cursor.style.height = '100px';
                } else {
                    params.targetMouse3D.set(20, 20, 20);
                    cursor.style.width = '40px';
                    cursor.style.height = '40px';
                }
                params.mouse3D.lerp(params.targetMouse3D, 0.1);
            }

            if (material && material.userData.shader) {
                const s = material.userData.shader;
                s.uniforms.uTime.value = elapsed;
                s.uniforms.uMagnetPos.value.copy(params.mouse3D);
                s.uniforms.uStrength.value = params.strength;
                s.uniforms.uRange.value = params.range;
                s.uniforms.uSpikes.value = params.spikes;
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = canvas.clientWidth / canvas.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        });
    </script>
</body>

</html>
