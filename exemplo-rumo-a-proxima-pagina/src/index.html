<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rumo à Próxima Página</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- Hero with drone video -->
    <div class="hero">
        <video autoplay loop muted style="max-height: 50vh; width: 100%">
            <source src="https://example.com/drone-video.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Gallery of YouTube videos with Jessica -->
    <div class="gallery">
        <h2>Galeria do YouTube com a Jéssica</h2>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/YOUR_YOUTUBE_VIDEO_ID?controls=1&autoplay=1&mute=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>

    <!-- Map using iOverlander -->
    <h2>Mapa</h2>
    <iframe src="https://ioverlander.com/map?view=road&startPoint=LATITUDE,LONGITUDE" width="100%" height="600"></iframe>
</body>
</html>
